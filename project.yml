name: CLIProxyGUI
options:
  bundleIdPrefix: com.wszf
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.7.1"
    CURRENT_PROJECT_VERSION: "13"
    CODE_SIGN_STYLE: Automatic
targets:
  CLIProxyGUI:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wszf.cli-proxy-gui
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets:
        - CLIProxyGUITests
  CLIProxyGUITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CLIProxyGUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wszf.cli-proxy-gui.tests
        GENERATE_INFOPLIST_FILE: YES
